<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Contato</title>
	<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/global.css') }}"
	/>
	<link
		rel="stylesheet"
		href="{{ url_for('static', filename='css/formularios.css') }}"
	/>
	<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/contato.css') }}"
	/>
	<link
	rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
	integrity="sha512-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
	crossorigin="anonymous"
	referrerpolicy="no-referrer"
	/>
</head>
<body class="contato-page">
	<nav aria-label="Navegação principal">
        <ul class="ul-navbar">
            <li>
                <img class="logo-sistema" src="{{ url_for('static', filename='images/logo_app.png') }}" alt="Logo do sistema">
            </li>
            <li><a href="{{ url_for('home') }}"><strong>Home</strong></a></li>
            <li><a href="#"><strong>Sobre</strong></a></li>
            <li><a href="{{ url_for('criar_orcamento') }}"><strong>Criar orçamento</a></strong></li>
        </ul>
    </nav>
	<section class="conteudo-main" aria-labelledby="info-orcamento">
		<header class="header-texto">
			<h1>Deixe sua mensagem!</h1>
		</header>
		<form method="POST" action="/contato">
			<fieldset>
				<legend id="info-orcamento">
					Informações de Contato
				</legend>

				<div>
					<label for="nome">Nome</label>
					<input type="text" id="nome" name="nome" required />
				</div>

				<div>
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" required />
				</div>

				<div>
					<label for="telefone">Telefone</label>
					<input type="tel" id="telefone" name="telefone" />
				</div>

				<div>
					<label for="mensagem">Mensagem</label>
					<textarea id="mensagem" name="mensagem" rows="4" required></textarea>
				</div>

				<button type="submit">Enviar</button>
			</fieldset>

		</form>
	<main class="contato-grid" aria-label="Opções de contato">
	<div class="contato-card">
		<a
		class="contato-link"
		href="https://wa.me/5519989473312"
		target="_blank"
		rel="noopener noreferrer"
		>
		<img
			src="{{ url_for('static', filename='images/whats.svg') }}"
			id="whats_icone"
			alt="Ícone do WhatsApp"
		/>
		<span>Entrar em contato</span>
		</a>
	</div>
	<div class="contato-card">
		<a
		class="contato-link"
		href="mailto:nathalidorio@gmail.com"
		target="_blank"
		rel="noopener noreferrer"
		>
		<span class="icone">✉️</span>
		<span>Enviar e-mail</span>
		</a>
	</div>
	<div class="contato-card">
		<a
		class="contato-link"
		href="https://www.linkedin.com/in/nathã-lidório-7a68a32a4"
		target="_blank"
		rel="noopener noreferrer"
		>
		<img
			src="{{ url_for('static', filename='images/linkedin.png') }}"
			id="linkedin"
			alt="Ícone do LinkedIn"
		/>
		<span>Acessar LinkedIn</span>
		</a>
	</div>
	</main>
</body>
</html>
